# docker-compose build
volumes:
  postgis-data:
    driver: local
  cloudbeaver:
    driver: local

services:
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    restart: on-failure
    ports:
      - '8978:8978'
    volumes:
      - cloudbeaver:/opt/cloudbeaver/workspace
    environment:
      - CLOUDBEAVER_EXPIRE_SESSION_AFTER_PERIOD=1800000
  db:
    container_name: postgis
    build:
      dockerfile: onomap/postgis/Dockerfile
    user: "${UID}:${GID}"
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./:/data
    environment:
      # If you need to create multiple database you can add coma separated databases eg gis,data
      - POSTGRES_DB=noisecapture
      - POSTGRES_USER=onomap
      - POSTGRES_PASSWORD=onomap
    ports:
      - 5432:5432
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onomap"]
      interval: 60s
      timeout: 5s
      retries: 5
  onomap:
    build:
      context: ./onomap
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8888:8888"
    environment:
      # If you need to create multiple database you can add coma separated databases eg gis,data
      - PGHOST=postgis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s